version: "3"

# Cross-platform entry points for the native sample manager.
#
#   task tui                  interactive launcher
#   task start -- postgres    start, wait until ready, and seed when needed
#   task stop  -- postgres    stop without deleting data
#   task reset -- postgres    delete data and recreate a ready engine
#
# DB=postgres remains supported for callers that cannot pass arguments after --.

silent: true

vars:
  IRODORI_EXE: '{{if eq .OS "windows"}}irodori.exe{{else}}irodori{{end}}'
  IRODORI_BIN: '{{.ROOT_DIR}}/.build/irodori/bin/{{.IRODORI_EXE}}'

# Task variables provide a shell-independent override on every platform:
# `task doctor RUNTIME=docker`.
env:
  IRODORI_CONTAINER_RUNTIME: '{{.RUNTIME | default .IRODORI_CONTAINER_RUNTIME}}'

tasks:
  default:
    desc: Show tasks and supported engines
    deps: [build]
    cmds:
      - task --list --sort none
      - '"{{.IRODORI_BIN}}" list'

  build:
    desc: Build the native manager, TUI, and fixture generator
    sources:
      - tools/irodori/Cargo.toml
      - tools/irodori/Cargo.lock
      - tools/irodori/src/**/*.rs
    generates:
      - '{{.IRODORI_BIN}}'
    cmds:
      - cargo install --path tools/irodori --root .build/irodori --locked --force

  tui:
    desc: Open the native interactive engine launcher
    deps: [build]
    interactive: true
    cmds:
      - '"{{.IRODORI_BIN}}" tui'

  list:
    desc: List supported engines and seed modes
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" list'

  start:
    desc: Start one engine, wait until ready, and seed it when supported
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" start'

  up:
    desc: Run compose up without waiting or applying a manual seed
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" up'

  stop:
    desc: Stop one engine without deleting its data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" stop'

  down:
    desc: Delete one engine and its data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" down'

  reset:
    desc: Delete one engine and recreate it with sample data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" reset'

  seed:
    desc: Apply or recreate one engine's generated sample data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" seed'

  status:
    desc: Show the state of every sample engine
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" status'

  logs:
    desc: Show recent logs for one engine
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" logs'

  stop:all:
    desc: Stop every container-backed engine without deleting data
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" stop-all'

  down:all:
    desc: Delete every sample engine and its data
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" down-all'

  urls:
    desc: Print every connection string
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" urls'

  doctor:
    desc: Check the native manager, container runtime, and optional local tools
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" doctor'

  generate:
    desc: Regenerate seed fixtures with the native tool
    deps: [build]
    env:
      SCALE: '{{.SCALE | default "0.02"}}'
      SEED: '{{.SEED | default "20260807"}}'
    cmds:
      - '"{{.IRODORI_BIN}}" generate'

  test:
    desc: Run native tool unit and fixture reproducibility tests
    cmds:
      - cargo test --manifest-path tools/irodori/Cargo.toml --locked

  lint:
    desc: Check native tool formatting and lints
    cmds:
      - cargo fmt --manifest-path tools/irodori/Cargo.toml --check
      - cargo clippy --manifest-path tools/irodori/Cargo.toml --all-targets --locked -- -D warnings

  check:
    desc: Run all native tests and repository validation
    deps: [build]
    cmds:
      - task: lint
      - task: test
      - '"{{.IRODORI_BIN}}" check'

  certs:
    desc: Issue the local CA and certificates used by secure containers
    deps: [build]
    cmds:
      - '"{{.IRODORI_BIN}}" certs'

  start:secure:
    desc: Start the TLS variant, wait until ready, and seed it
    deps: [certs]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" start --variant tls'

  up:secure:
    desc: Start the TLS variant without waiting
    deps: [certs]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" up --variant tls'

  down:secure:
    desc: Delete the TLS variant and its data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" down --variant tls'

  up:host:
    desc: Start the host-network variant (Linux fallback)
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" up --variant host'

  start:host:
    desc: Start the host-network variant and wait until ready (Linux fallback)
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" start --variant host'

  stop:host:
    desc: Stop the host-network variant without deleting its data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" stop --variant host'

  down:host:
    desc: Delete the host-network variant and its data
    deps: [build]
    vars: { ENGINE: '{{.DB | default .CLI_ARGS | default "postgres"}}' }
    env: { IRODORI_ENGINE: "{{.ENGINE}}" }
    cmds:
      - '"{{.IRODORI_BIN}}" down --variant host'

  graphify-setup:
    desc: Install graphify and register its skill with Claude, Copilot and Codex
    cmds:
      - sh scripts/graphify.sh setup

  graphify-update:
    desc: Upgrade graphify, refresh the skill, and update the knowledge graph
    cmds:
      - sh scripts/graphify.sh update

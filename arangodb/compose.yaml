name: irodori-arangodb
# Irodori URL: http://localhost:58529  user root / irodori, database samples
# Needs the `irodori.arangodb` connector extension.
services:
  arangodb:
    image: docker.io/library/arangodb:3.12
    environment:
      ARANGO_ROOT_PASSWORD: irodori
    ports:
      - "58529:8529"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8529/_api/version -u root:irodori || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60

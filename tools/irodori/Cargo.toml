[package]
name = "irodori-samples-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Native cross-platform manager and fixture generator for irodori-samples"
license = "0BSD"
publish = false

[[bin]]
name = "irodori"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

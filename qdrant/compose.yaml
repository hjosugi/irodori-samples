name: irodori-qdrant
# Irodori URL: http://localhost:56333  collection `products` (no API key)
# Needs the `irodori.qdrant` connector extension.
services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.5
    ports:
      - "56333:6333"
      - "56334:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

name: irodori-influxdb
# Irodori URL: http://localhost:58086  database samples, no token
services:
  influxdb:
    image: docker.io/library/influxdb:3-core
    command:
      - "influxdb3"
      - "serve"
      - "--node-id=irodori"
      - "--object-store=file"
      - "--data-dir=/var/lib/influxdb3"
      - "--http-bind=0.0.0.0:8086"
      - "--without-auth"
    ports:
      - "58086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8086/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

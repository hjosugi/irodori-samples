name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  native-manager:
    name: Native manager (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: go-task/setup-task@v1
      - name: Format
        run: cargo fmt --manifest-path tools/irodori/Cargo.toml --check
      - name: Lint
        run: cargo clippy --manifest-path tools/irodori/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --manifest-path tools/irodori/Cargo.toml --locked
      - name: Build native binary through Task
        run: task build
      - name: Smoke-test Task entry point
        run: task list
      - name: Verify native fixture generator
        run: task generate SCALE=0.02 SEED=20260807
      - name: Check fixture reproducibility
        run: git diff --exit-code
      - name: Validate samples, Compose, and connections
        if: runner.os == 'Linux'
        run: .build/irodori/bin/irodori check
